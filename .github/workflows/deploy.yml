name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'BoyJiang2/boyJiang2.github.io'
    runs-on: ubuntu-latest
    env:
      ASTRO_SITE: https://boyjiang2.github.io
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build and upload site
        uses: withastro/action@v5

  deploy:
    if: github.repository == 'BoyJiang2/boyJiang2.github.io'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
